<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%" fill="none">
    <defs>
        <radialGradient id="defGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.35"/>
            <stop offset="60%" stop-color="#0284C7" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="defShadow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#020617" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="defScreen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0F172A"/>
            <stop offset="50%" stop-color="#312E81"/>
            <stop offset="100%" stop-color="#06B6D4"/>
        </linearGradient>
        <filter id="defBlur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="14"/>
        </filter>
    </defs>

    <!-- Background atmosphere glow -->
    <ellipse cx="250" cy="170" rx="180" ry="120" fill="url(#defGlow)" filter="url(#defBlur)"/>
    <!-- Pedestal shadow -->
    <ellipse cx="250" cy="320" rx="180" ry="20" fill="url(#defShadow)"/>

    <!-- Electronics Combo: Smart TV/Monitor in Background + Smartphone in Foreground -->
    <g transform="translate(100, 45)">
        <!-- Monitor Display -->
        <rect x="0" y="0" width="280" height="175" rx="10" fill="#1E293B" stroke="#475569" stroke-width="2"/>
        <rect x="4" y="4" width="272" height="167" rx="8" fill="url(#defScreen)"/>
        <!-- Stand -->
        <polygon points="125,175 155,175 170,225 110,225" fill="#334155"/>
        <rect x="90" y="222" width="100" height="6" rx="3" fill="#1E293B"/>

        <!-- Display Art -->
        <circle cx="140" cy="85" r="45" fill="#4F46E5" opacity="0.5" filter="url(#defBlur)"/>
        <path d="M4 125 L90 85 L180 120 L276 75 L276 171 L4 171 Z" fill="#0B1329" opacity="0.8"/>
        <!-- Sheen -->
        <polygon points="10,4 90,4 276,120 276,160 160,4" fill="#FFFFFF" fill-opacity="0.08"/>
    </g>

    <!-- Smartphone Leaning in Foreground Left -->
    <g transform="translate(80, 105) rotate(-8)">
        <rect x="0" y="0" width="85" height="170" rx="18" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5"/>
        <rect x="3" y="3" width="79" height="164" rx="15" fill="#1E1B4B"/>
        <circle cx="42.5" cy="10" r="3" fill="#06B6D4"/>
        <!-- Wallpaper -->
        <path d="M3 80 Q40 50 79 80 L79 167 L3 167 Z" fill="#4338CA"/>
        <circle cx="42.5" cy="70" r="18" fill="#EC4899" opacity="0.6" filter="url(#defBlur)"/>
        <rect x="25" y="160" width="35" height="3" rx="1.5" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- Floating Badge: ALLZONE Verified -->
    <g transform="translate(305, 230)">
        <rect x="0" y="0" width="140" height="30" rx="15" fill="#0B1329" fill-opacity="0.9" stroke="#38BDF8" stroke-width="1.2"/>
        <text x="16" y="19" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#38BDF8">⚡ Verified Electronics</text>
    </g>
</svg>
