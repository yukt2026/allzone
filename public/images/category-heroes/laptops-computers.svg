<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%" fill="none">
    <defs>
        <!-- Laptop ambient glow -->
        <radialGradient id="laptopGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.35"/>
            <stop offset="50%" stop-color="#2563EB" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
        </radialGradient>
        <!-- Ground shadow -->
        <radialGradient id="laptopShadow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#020617" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
        </radialGradient>
        <!-- Metallic body gradient -->
        <linearGradient id="laptopBody" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#CBD5E1"/>
            <stop offset="25%" stop-color="#94A3B8"/>
            <stop offset="50%" stop-color="#E2E8F0"/>
            <stop offset="85%" stop-color="#64748B"/>
            <stop offset="100%" stop-color="#334155"/>
        </linearGradient>
        <!-- Laptop screen wallpaper -->
        <linearGradient id="laptopScreen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0F172A"/>
            <stop offset="35%" stop-color="#1E1B4B"/>
            <stop offset="70%" stop-color="#4338CA"/>
            <stop offset="100%" stop-color="#06B6D4"/>
        </linearGradient>
        <filter id="laptopBlur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="14"/>
        </filter>
    </defs>

    <!-- Background atmosphere glow -->
    <ellipse cx="250" cy="170" rx="180" ry="120" fill="url(#laptopGlow)" filter="url(#laptopBlur)"/>
    <!-- Pedestal ground shadow -->
    <ellipse cx="250" cy="315" rx="190" ry="20" fill="url(#laptopShadow)"/>

    <!-- Open Laptop in Semi-Isometric Perspective -->
    <g transform="translate(90, 45)">
        <!-- Display Lid (Tilted Back) -->
        <g transform="translate(30, 0)">
            <!-- Outer Aluminum Lid Shell -->
            <polygon points="15,0 245,0 260,165 0,165" fill="url(#laptopBody)"/>
            <!-- Inner Display Bezel -->
            <polygon points="18,3 242,3 256,162 4,162" fill="#020617"/>
            <!-- Display Screen -->
            <polygon points="22,8 238,8 252,158 8,158" fill="url(#laptopScreen)"/>

            <!-- Screen Visual Artwork (Glowing Code / Creative Waves) -->
            <circle cx="130" cy="65" r="40" fill="#6366F1" opacity="0.4" filter="url(#laptopBlur)"/>
            <circle cx="190" cy="100" r="30" fill="#06B6D4" opacity="0.3" filter="url(#laptopBlur)"/>

            <!-- Code/Creative UI Lines -->
            <g transform="translate(35, 30)" opacity="0.8">
                <rect x="0" y="0" width="40" height="4" rx="2" fill="#A5B4FC"/>
                <rect x="0" y="10" width="70" height="4" rx="2" fill="#38BDF8"/>
                <rect x="15" y="20" width="55" height="4" rx="2" fill="#F472B6"/>
                <rect x="15" y="30" width="90" height="4" rx="2" fill="#4ADE80"/>
                <rect x="0" y="40" width="45" height="4" rx="2" fill="#FDE047"/>
            </g>

            <!-- Screen Sheen Reflection -->
            <polygon points="50,8 100,8 220,158 170,158" fill="#FFFFFF" fill-opacity="0.08"/>

            <!-- Webcam & Mic in Top Bezel -->
            <circle cx="130" cy="5" r="1.5" fill="#475569"/>
            <circle cx="130" cy="5" r="0.8" fill="#38BDF8"/>
        </g>

        <!-- Base Chassis / Keyboard Deck (Extending Forward) -->
        <g transform="translate(0, 160)">
            <!-- Bottom Base Shell -->
            <polygon points="30,5 290,5 320,105 0,105" fill="url(#laptopBody)"/>
            <!-- Front Lip Bevel -->
            <polygon points="0,105 320,105 315,115 5,115" fill="#475569"/>

            <!-- Keyboard Well Inset -->
            <polygon points="42,12 278,12 292,68 28,68" fill="#0F172A" stroke="#334155" stroke-width="1"/>

            <!-- Backlit Keyboard Keys Rows -->
            <g fill="#1E293B" stroke="#475569" stroke-width="0.8">
                <!-- Row 1 -->
                <rect x="46" y="16" width="16" height="8" rx="2"/>
                <rect x="66" y="16" width="16" height="8" rx="2"/>
                <rect x="86" y="16" width="16" height="8" rx="2"/>
                <rect x="106" y="16" width="16" height="8" rx="2"/>
                <rect x="126" y="16" width="16" height="8" rx="2"/>
                <rect x="146" y="16" width="16" height="8" rx="2"/>
                <rect x="166" y="16" width="16" height="8" rx="2"/>
                <rect x="186" y="16" width="16" height="8" rx="2"/>
                <rect x="206" y="16" width="16" height="8" rx="2"/>
                <rect x="226" y="16" width="16" height="8" rx="2"/>
                <rect x="246" y="16" width="24" height="8" rx="2"/>

                <!-- Row 2 -->
                <rect x="44" y="27" width="20" height="9" rx="2"/>
                <rect x="68" y="27" width="16" height="9" rx="2"/>
                <rect x="88" y="27" width="16" height="9" rx="2"/>
                <rect x="108" y="27" width="16" height="9" rx="2"/>
                <rect x="128" y="27" width="16" height="9" rx="2"/>
                <rect x="148" y="27" width="16" height="9" rx="2"/>
                <rect x="168" y="27" width="16" height="9" rx="2"/>
                <rect x="188" y="27" width="16" height="9" rx="2"/>
                <rect x="208" y="27" width="16" height="9" rx="2"/>
                <rect x="228" y="27" width="16" height="9" rx="2"/>
                <rect x="248" y="27" width="25" height="9" rx="2"/>

                <!-- Row 3 (Spacebar row) -->
                <rect x="42" y="40" width="24" height="10" rx="2"/>
                <rect x="70" y="40" width="16" height="10" rx="2"/>
                <rect x="90" y="40" width="105" height="10" rx="2.5" fill="#334155"/> <!-- Space bar -->
                <rect x="200" y="40" width="16" height="10" rx="2"/>
                <rect x="220" y="40" width="16" height="10" rx="2"/>
                <rect x="240" y="40" width="36" height="10" rx="2"/>
            </g>

            <!-- Precision Glass Trackpad -->
            <polygon points="120,74 200,74 204,100 116,100" fill="#94A3B8" stroke="#CBD5E1" stroke-width="1" opacity="0.6"/>
        </g>
    </g>

    <!-- Floating Badge: High Performance CPU -->
    <g transform="translate(305, 235)">
        <rect x="0" y="0" width="140" height="30" rx="15" fill="#0B1329" fill-opacity="0.9" stroke="#6366F1" stroke-width="1.2"/>
        <text x="16" y="19" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#A5B4FC">⚡ Core i7 &bull; M-Series</text>
    </g>
</svg>
