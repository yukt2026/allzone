<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%" fill="none">
    <defs>
        <!-- Ambient back-glow -->
        <radialGradient id="accGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
            <stop offset="60%" stop-color="#6366F1" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
        </radialGradient>
        <!-- Ground shadow -->
        <radialGradient id="accShadow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#020617" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
        </radialGradient>
        <!-- Monitor screen gradient -->
        <linearGradient id="monScreen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0F172A"/>
            <stop offset="40%" stop-color="#1E1B4B"/>
            <stop offset="75%" stop-color="#2563EB"/>
            <stop offset="100%" stop-color="#06B6D4"/>
        </linearGradient>
        <filter id="accBlur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="14"/>
        </filter>
    </defs>

    <!-- Background atmosphere glow -->
    <ellipse cx="250" cy="165" rx="180" ry="120" fill="url(#accGlow)" filter="url(#accBlur)"/>
    <!-- Pedestal shadow -->
    <ellipse cx="250" cy="320" rx="180" ry="18" fill="url(#accShadow)"/>

    <!-- High-Refresh Curved Gaming Monitor -->
    <g transform="translate(100, 30)">
        <!-- Outer Frame -->
        <rect x="0" y="0" width="300" height="180" rx="10" fill="#1E293B" stroke="#475569" stroke-width="2"/>
        <rect x="3" y="3" width="294" height="174" rx="8" fill="#020617"/>

        <!-- Display Screen -->
        <rect x="5" y="5" width="290" height="170" rx="6" fill="url(#monScreen)"/>

        <!-- Screen Graphic Elements -->
        <circle cx="150" cy="85" r="45" fill="#3B82F6" opacity="0.4" filter="url(#accBlur)"/>
        <polygon points="120,40 180,40 210,120 90,120" fill="#6366F1" opacity="0.3"/>
        <path d="M5 140 Q80 100 150 130 T295 100 L295 175 L5 175 Z" fill="#0F172A" opacity="0.8"/>

        <!-- Screen Sheen -->
        <path d="M10 5 L120 5 L290 120 L290 160 L180 5 Z" fill="#FFFFFF" fill-opacity="0.08"/>

        <!-- Refresh Rate Watermark -->
        <g transform="translate(14, 14)">
            <rect x="0" y="0" width="55" height="18" rx="4" fill="#000000" fill-opacity="0.6" stroke="#38BDF8" stroke-width="0.8"/>
            <text x="27.5" y="12.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="900" fill="#38BDF8" text-anchor="middle">165Hz IPS</text>
        </g>

        <!-- Monitor Stand Neck & Base -->
        <g transform="translate(130, 180)">
            <rect x="15" y="0" width="10" height="50" rx="3" fill="#334155"/>
            <!-- V-shaped metal stand base -->
            <polygon points="20,45 -30,68 70,68" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
        </g>
    </g>

    <!-- Compact Wireless Mechanical Keyboard (Foreground) -->
    <g transform="translate(95, 235)">
        <rect x="0" y="0" width="180" height="60" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
        <!-- RGB Backlit Underglow Strip -->
        <rect x="4" y="56" width="172" height="2" fill="#38BDF8" filter="url(#accBlur)"/>

        <!-- Keycaps Matrix -->
        <g fill="#1E293B" stroke="#475569" stroke-width="0.7">
            <!-- Row 1 -->
            <rect x="6" y="6" width="14" height="10" rx="2"/><rect x="22" y="6" width="12" height="10" rx="2"/><rect x="36" y="6" width="12" height="10" rx="2"/><rect x="50" y="6" width="12" height="10" rx="2"/><rect x="64" y="6" width="12" height="10" rx="2"/><rect x="78" y="6" width="12" height="10" rx="2"/><rect x="92" y="6" width="12" height="10" rx="2"/><rect x="106" y="6" width="12" height="10" rx="2"/><rect x="120" y="6" width="12" height="10" rx="2"/><rect x="134" y="6" width="12" height="10" rx="2"/><rect x="148" y="6" width="26" height="10" rx="2" fill="#3B82F6"/>

            <!-- Row 2 -->
            <rect x="6" y="18" width="18" height="10" rx="2"/><rect x="26" y="18" width="12" height="10" rx="2"/><rect x="40" y="18" width="12" height="10" rx="2"/><rect x="54" y="18" width="12" height="10" rx="2"/><rect x="68" y="18" width="12" height="10" rx="2"/><rect x="82" y="18" width="12" height="10" rx="2"/><rect x="96" y="18" width="12" height="10" rx="2"/><rect x="110" y="18" width="12" height="10" rx="2"/><rect x="124" y="18" width="12" height="10" rx="2"/><rect x="138" y="18" width="12" height="10" rx="2"/><rect x="152" y="18" width="22" height="10" rx="2"/>

            <!-- Row 3 (Spacebar) -->
            <rect x="6" y="30" width="22" height="10" rx="2"/><rect x="30" y="30" width="12" height="10" rx="2"/><rect x="44" y="30" width="70" height="10" rx="2" fill="#334155"/><rect x="116" y="30" width="12" height="10" rx="2"/><rect x="130" y="30" width="12" height="10" rx="2"/><rect x="144" y="30" width="30" height="10" rx="2" fill="#2563EB"/>
        </g>
    </g>

    <!-- Ergonomic Wireless Mouse (Right Foreground) -->
    <g transform="translate(300, 238)">
        <path d="M15 0 C28 0, 32 15, 32 35 C32 52, 26 58, 16 58 C6 58, 0 52, 0 35 C0 15, 4 0, 15 0 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
        <line x1="16" y1="4" x2="16" y2="24" stroke="#475569" stroke-width="1"/>
        <!-- Scroll wheel with RGB glow -->
        <rect x="14" y="10" width="4" height="10" rx="2" fill="#38BDF8"/>
        <!-- Thumb rest curve -->
        <path d="M0 25 C-4 35, -4 45, 2 52" stroke="#475569" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Floating Badge -->
    <g transform="translate(315, 220)">
        <rect x="0" y="0" width="130" height="28" rx="14" fill="#0B1329" fill-opacity="0.9" stroke="#3B82F6" stroke-width="1.2"/>
        <text x="14" y="18" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#93C5FD">⚡ High-Precision Gear</text>
    </g>
</svg>
