<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
    <defs>
        <linearGradient id="h3bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#020617"/>
            <stop offset="60%" stop-color="#0F172A"/>
            <stop offset="100%" stop-color="#1E1B4B"/>
        </linearGradient>
    </defs>
    <rect width="1200" height="480" fill="url(#h3bg)"/>
    <g opacity="0.2">
        <circle cx="980" cy="240" r="240" fill="none" stroke="#6366F1" stroke-width="2"/>
    </g>
    <!-- Right side: Giant Smart TV with glowing bezel -->
    <g transform="translate(760, 90)">
        <rect x="0" y="0" width="360" height="230" rx="12" fill="#0F172A" stroke="#2563EB" stroke-width="5"/>
        <rect x="15" y="15" width="330" height="200" rx="6" fill="#1E293B"/>
        <text x="180" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="#38BDF8" text-anchor="middle">4K ULTRA HD</text>
        <text x="180" y="155" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#94A3B8" text-anchor="middle">DOLBY ATMOS • GOOGLE TV</text>
        <path d="M140 230 L120 280 M220 230 L240 280 M90 280 H270" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- Left text -->
    <g transform="translate(80, 110)">
        <rect x="0" y="0" width="240" height="32" rx="16" fill="#2563EB" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1.5"/>
        <text x="15" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#38BDF8" letter-spacing="1.5">🎬 HOME ENTERTAINMENT</text>
        <text x="0" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF">Smart TVs &amp; Home</text>
        <text x="0" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#38BDF8">Cinematic Audio</text>
        <text x="0" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="500" fill="#E2E8F0">Experience theatre sound and crystal 4K displays from Sony, Samsung &amp; LG.</text>
        <rect x="0" y="235" width="180" height="52" rx="26" fill="#2563EB"/>
        <text x="75" y="267" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">VIEW TVS</text>
        <text x="145" y="267" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF">→</text>
    </g>
</svg>