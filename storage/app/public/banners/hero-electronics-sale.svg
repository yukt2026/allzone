<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
    <defs>
        <linearGradient id="h1bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0F172A"/>
            <stop offset="50%" stop-color="#1E3A8A"/>
            <stop offset="100%" stop-color="#0284C7"/>
        </linearGradient>
    </defs>
    <rect width="1200" height="480" fill="url(#h1bg)"/>
    <!-- Tech grid lines & circles -->
    <g opacity="0.15">
        <circle cx="1000" cy="240" r="280" fill="none" stroke="#FFFFFF" stroke-width="2"/>
        <circle cx="1000" cy="240" r="180" fill="none" stroke="#38BDF8" stroke-width="2"/>
        <line x1="800" y1="0" x2="800" y2="480" stroke="#FFFFFF" stroke-width="1"/>
        <line x1="950" y1="0" x2="950" y2="480" stroke="#FFFFFF" stroke-width="1"/>
    </g>
    <!-- Right side illustration: Smartphone & Laptop artwork -->
    <g transform="translate(860, 100)">
        <!-- Laptop -->
        <rect x="0" y="80" width="240" height="150" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="4"/>
        <rect x="15" y="95" width="210" height="120" rx="4" fill="#0284C7" fill-opacity="0.3"/>
        <path d="M-30 230 H270 L250 255 H-10 Z" fill="#334155" stroke="#38BDF8" stroke-width="2"/>
        <!-- Smartphone leaning -->
        <rect x="180" y="40" width="90" height="170" rx="14" fill="#0F172A" stroke="#06B6D4" stroke-width="4"/>
        <rect x="186" y="52" width="78" height="144" rx="8" fill="#1E3A8A"/>
        <circle cx="225" cy="46" r="3" fill="#06B6D4"/>
        <!-- Glow badge -->
        <rect x="110" y="20" width="110" height="34" rx="17" fill="#22C55E"/>
        <text x="165" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">UP TO 40% OFF</text>
    </g>
    <!-- Left text -->
    <g transform="translate(80, 110)">
        <rect x="0" y="0" width="220" height="32" rx="16" fill="#06B6D4" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1.5"/>
        <text x="15" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#38BDF8" letter-spacing="1.5">⚡ ALLZONE MEGA ELECTRONICS</text>
        <text x="0" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="46" font-weight="900" fill="#FFFFFF">Latest Electronics &amp;</text>
        <text x="0" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="46" font-weight="900" fill="#38BDF8">Smart Devices</text>
        <text x="0" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="500" fill="#E2E8F0">Top flagship phones, high-speed laptops &amp; premium audio from OnePlus, Samsung &amp; Boat.</text>
        <!-- CTA Button -->
        <rect x="0" y="235" width="180" height="52" rx="26" fill="#2563EB"/>
        <text x="75" y="267" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">SHOP NOW</text>
        <text x="145" y="267" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF">→</text>
    </g>
</svg>